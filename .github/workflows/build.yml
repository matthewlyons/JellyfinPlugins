name: Build plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet publish Jellyfin.Plugin.ChapterSkip/Jellyfin.Plugin.ChapterSkip.csproj -c Release -o out
      - uses: actions/upload-artifact@v4
        with:
          name: ChapterSkip
          path: out/Jellyfin.Plugin.ChapterSkip.dll
